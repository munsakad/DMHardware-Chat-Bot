name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble site
        run: |
          mkdir -p _site
          cp web/index.html web/app.js web/retriever.js web/style.css web/knowledge.html web/knowledge.js _site/

      - name: Build the retrieval index with the Python retriever
        run: |
          pip install "pandas>=2.0" "numpy>=1.24" "scikit-learn>=1.3"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          python generate_dataset.py
          python train_topic_model.py
          python -m unittest -v test_pipeline
          python web/export_index.py _site
          cp data/manifest.json data/knowledge_base.csv _site/
          cp models/metrics.json _site/model-metrics.json

      - name: Verify the JS retriever matches Python
        run: node web/check-parity.mjs _site

      - name: Drop CI-only files
        run: rm _site/parity.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
